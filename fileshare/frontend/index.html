}

#downloadProgress {

<body>
<div id="infoButton" onclick="openInfo()">ℹ️ Info</div>
    <div class="container">

        <h1>FileShare</h1>
<button onclick="openSettings()">⚙️ Settings</button>
        <p>Share your files easily</p>

        <input type="file" id="fileInput">

        <br>

        <button onclick="uploadFile()">
            Upload File
        </button>

        <p id="status"></p>
<div id="uploadProgress"></div>
    </div>


    <script>

        async function uploadFile() {

            const fileInput = document.getElementById("fileInput");
            const status = document.getElementById("status");

            if (fileInput.files.length === 0) {
                status.innerText = "Please select a file.";
                return;
            }

            const file = fileInput.files[0];

            const formData = new FormData();
            formData.append("file", file);

            status.innerText = "Uploading...";

            try {

                const response = await new Promise((resolve, reject) => {

    const xhr = new XMLHttpRequest();

    xhr.open(
        "POST",
        (localStorage.getItem("serverUrl") || "http://localhost:5000") + "/upload"
    );

    const uploadProgress = document.getElementById("uploadProgress");

    uploadProgress.innerHTML = `
        Uploading... 0%
        <div class="progress-container">
            <div class="progress-bar" id="uploadProgressBar" style="width: 0%;"></div>
        </div>
    `;

    xhr.upload.onprogress = function (event) {

        if (event.lengthComputable) {

            const percent = Math.round(
                (event.loaded / event.total) * 100
            );

            uploadProgress.innerHTML = `
                Uploading... ${percent}%
                <div class="progress-container">
                    <div class="progress-bar"
                         id="uploadProgressBar"
                         style="width: ${percent}%;">
                    </div>
                </div>
            `;
        }
    };

    xhr.onload = function () {

        resolve({
            ok: xhr.status >= 200 && xhr.status < 300,
            json: async function () {
                return JSON.parse(xhr.responseText);
            }
        });

    };

    xhr.onerror = function () {
        reject(new Error("Upload failed"));
    };

    xhr.send(formData);
});

                const data = await response.json();

                if (response.ok) {

                    status.innerHTML =
                        "✅ File uploaded successfully!" +
                        "<br><br>" +
                        "File: " + data.filename +
                        "<br><br>" +

                        '<input id="shareLink" value="' +
                        data.download_url +
'" readonly>' +
"<br><br>" +
'<button onclick="copyLink()">📋 Copy Link</button>' +
"<br><br>" +
'<button onclick="downloadFile(\'' +
data.download_url +
'\', \'' +
data.filename +
'\')">📥 Download File</button>' +
"<br><br>" +
'<div id="downloadProgress"></div>';
} else {

                    status.innerText =
                        "❌ " + data.error;

                }

            } catch (error) {

                status.innerText =
                    "❌ Server se connection nahi hua.";

            }

        }

async function downloadFile(url, fileName) {

    const progress = document.getElementById("downloadProgress");

    progress.innerHTML = `
        Downloading... 0%
        <div class="progress-container">
            <div class="progress-bar" id="progressBar" style="width: 0%;"></div>
        </div>
    `;

    try {

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("Download failed");
        }

        const total = parseInt(
            response.headers.get("Content-Length"),
            10
        );

        const contentType =
            response.headers.get("Content-Type") ||
            "application/octet-stream";

        const reader = response.body.getReader();

        let received = 0;
        const chunks = [];

        while (true) {

            const { done, value } = await reader.read();

            if (done) {
                break;
            }

            chunks.push(value);
            received += value.length;

            if (total) {

                const percent = Math.round(
                    (received / total) * 100
                );

                progress.innerHTML = `
                    Downloading... ${percent}%
                    <div class="progress-container">
                        <div class="progress-bar"
                             style="width: ${percent}%;">
                        </div>
                    </div>
                `;
            }
        }

        const blob = new Blob(chunks, {
            type: contentType
        });

        const downloadUrl =
            window.URL.createObjectURL(blob);

        const a = document.createElement("a");

        a.href = downloadUrl;
        a.download = fileName;

        document.body.appendChild(a);

        a.click();

        a.remove();

        window.URL.revokeObjectURL(downloadUrl);

        progress.innerText =
            "✅ Download Complete! 100%";

    } catch (error) {

        progress.innerText =
            "❌ Download failed.";

        console.error(error);
    }
}
function openSettings() {

    const panel = document.getElementById("settingsPanel");

    const savedUrl = localStorage.getItem("serverUrl");

    document.getElementById("serverUrl").value =
        savedUrl || "http://localhost:5000";

    panel.style.display = "flex";
}


function closeSettings() {

    document.getElementById("settingsPanel").style.display = "none";
}


function saveSettings() {

    const url =
        document.getElementById("serverUrl").value.trim();

    if (url === "") {

        document.getElementById("settingsStatus").innerText =
            "❌ Server address enter karo.";

        return;
    }

    localStorage.setItem("serverUrl", url);

    document.getElementById("settingsStatus").innerText =
        "✅ Server address saved!";
}
function openInfo() {
    document.getElementById("infoPanel").style.display = "flex";
}

function closeInfo() {
    document.getElementById("infoPanel").style.display = "none";
}
        function copyLink() {

            const link =
                document.getElementById("shareLink");

            navigator.clipboard.writeText(link.value);

            alert("✅ Download link copied!");

        }
